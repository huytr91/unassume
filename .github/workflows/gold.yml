name: Gold set

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gold:
    name: test:gold
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Gold set
        run: npm run test:gold
      - name: Typecheck / build
        run: npm run build
